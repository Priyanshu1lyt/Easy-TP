name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report build problems as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re

          try:
              lines = open('build.log', errors='replace').read().splitlines()
          except OSError:
              lines = []

          detail_prefixes = ('symbol:', 'location:', 'required:', 'found:', 'reason:', '^', 'note:')
          blocks = []
          index = 0

          while index < len(lines):
              line = lines[index]
              if re.search(r'error:', line):
                  block = [line.strip()]
                  look = index + 1
                  while look < len(lines) and lines[look].strip().startswith(detail_prefixes):
                      block.append(lines[look].strip())
                      look += 1
                  blocks.append(' | '.join(block))
                  index = look
              else:
                  index += 1

          if not blocks:
              blocks = [l.strip() for l in lines[-40:] if l.strip()]

          for block in blocks[:40]:
              safe = block.replace('\r', ' ').replace('%', '%25').replace('\n', ' ')[:1200]
              print('::error::' + safe)
          PY

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: easy-tp-jar
          path: build/libs/*.jar
          if-no-files-found: error
